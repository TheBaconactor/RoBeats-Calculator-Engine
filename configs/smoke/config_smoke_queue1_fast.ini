[CalculateSong]
; Smoke: run a single song with a tiny GA depth so refactors can be validated quickly.
Song_Name =
Difficulty = All
TargetPrimary = All
TargetSecondary = All

[IterationEngine]
MetaFinder = true
ForceGreatsMode = true
ForceGreatsFinder = true
ForceGreatsDebug = false
AutoSelectBuffAndColor = true

; GPU-only policy: keep these enabled.
GPU_Mode = true
GPU_Native_GA = true

; Exit after the queue completes.
UseEvolutionDB = True
LoopForever = false

; Keep runs deterministic and fast.
SongRepeats = 1
BundleSongRepeats = true
SongQueueLimit = 1

; Tiny GA workload for smoke validation.
GA_SearchDepth = 5
GA_MultiStart = 1
GA_DBSeedProbability = 0.1
GA_FixedSeedCopies = 1

; Keep ForceGreats enabled but reduce fan-out.
FG_CandidateLimit = 10
FG_SearchRadius = 5

GPU_GA_MutationRate = 0.35
GPU_GA_TournamentK = 3
GPU_GA_ImmigrantRate = 0.1

EvalCPUCores = 0
InFlightSongs = 2
FG_DrainAtEnd = true
MemorySoftLimitGB = 16
MemorySoftLimitPercent = 0

InFlight_GA_QueueMult = 1
InFlight_PrepBufferMult = 2
InFlight_PrepWorkers = 2
InFlight_DecodeWorkers = 2
InFlight_FGPrepWorkers = 1
InFlight_PrimeTarget = 1

