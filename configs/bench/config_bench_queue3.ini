[CalculateSong]
; Benchmark: process a deterministic subset of songs (see IterationEngine.SongQueueLimit).
Song_Name =
Difficulty = All
TargetPrimary = All
TargetSecondary = All

[IterationEngine]
MetaFinder = true
ForceGreatsMode = true
ForceGreatsFinder = true
ForceGreatsDebug = false
AutoSelectBuffAndColor = true

; GPU acceleration
GPU_Mode = true
GPU_Native_GA = true

; Database integration
UseEvolutionDB = True
LoopForever = false

; GA settings
GA_SearchDepth = 500
GA_MultiStart = 35
GA_DBSeedProbability = 0.1
GA_FixedSeedCopies = 2
DeepMining = False

; ForceGreats Finder controls
FG_CandidateLimit = 200
FG_SearchRadius = 5

; GPU-native GA exploration knobs (optional)
GPU_GA_MutationRate = 0.35
GPU_GA_TournamentK = 3
GPU_GA_ImmigrantRate = 0.0

; Resource limits
EvalCPUCores = 0
InFlightSongs = 0
IgnoreResumeQueue = true
FG_DrainAtEnd = true

; Limit queue size for repeatable benchmarks (small queue for profiling song-to-song gaps).
SongQueueLimit = 3

[TeamContributionBuffConstant]
TeamBuff = T5
TeamColor = Rush

