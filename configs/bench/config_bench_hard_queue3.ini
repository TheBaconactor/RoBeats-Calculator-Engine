; Benchmark: process 3 Hard-difficulty songs (avoids MemoryGuard resume context).
; Inherits shared bench settings from ../common/bench_common.ini.
[CalculateSong]
; Override: restrict to Hard songs only.
Difficulty = Hard

[IterationEngine]
_extends = ../common/bench_common.ini
; Override: small queue for profiling song-to-song gaps.
SongQueueLimit = 3
IgnoreResumeQueue = true