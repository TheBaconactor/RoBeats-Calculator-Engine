[InventoryMetaCoverage]
; Inventory Meta Coverage (GPU-only, standardized on gpu_full)
;
; This file is the default configuration used by `inventory_meta_coverage_main.py`
; unless you pass `--config` (or set `METAFINDER_CONFIG_PATH`).
;
; High-level preset: low / medium / high
; - low: fast debugging
; - medium: balanced defaults (matches historical CLI defaults)
; - high: production-ish (higher K + more restarts)
Quality = medium

; Run controls
InventoryCap = 100
Seed = 1
Restarts = 1
Element =
SecondaryElement =
SongLimit = 0
Profile = false

[WitnessPool]
; Witness pool size (K_total = PartitionsPerSong + AdaptiveRounds * AdaptiveKeepPerSong)
PartitionsPerSong = 32
AdaptiveRounds = 3
AdaptiveKeepPerSong = 8

; Determinism / robustness knobs
AnchorPatterns = 128
SeedStreams = 1
Palettes = 1
; 0=balanced, 1=reuse-biased, 2=reuse-biased+canonical anchors
PatternProfile = 1

; Wildcard biases (OV==0)
WildcardFreqBonus = 40
WildcardPaletteSize = 0
WildcardPaletteMinCount = 2
; 0 = scan all palette entries
WildcardPaletteScan = 0
WildcardPaletteTailSlots = 3

; Kernel count update striping
CounterStripes = 1

[Candidates]
; Candidate selection (exact peak by default)
TopCandidates = 1
ScoreDelta = 0
LimitPerSong = 0

[LNS]
; Greedy + repack + LNS tuning
RepackPasses = 3
Destroy = 6
TimeSec = 0.0
Attempts = 200

RepackRarityWeighted = false
FreqWeighted = false
RandomDestroyProb = 0.0
RestoreAfter = 12
RestoreDrop = 4

[Biases]
; Tie-break / costs
VariantFreqMode = song_support
NewGearPenalty = 0

; Experimental: wildcard synergy (PPMI). Leave at 0 unless you have measured lift.
SynergyWeight = 0

[Repair]
; Inventory-only repair (does not expand inventory)
Enabled = true
Attempts = 128
MaxCandsPerSlot = 16
SongLimit = 512

[SeedInventory]
; Optional: pre-seed inventory variants
; File format: {"variants": [{"gear_name": "...", "offset": 123}, ...]}
VariantsPath =
; hard=locked variants, soft=drop seeded variants when unused
Mode = hard

[Expert]
; Advanced / research knobs (intentionally not exposed as top-level CLI flags)
SynergyTopOffsets = 128
SynergyMinPairCount = 2
SynergyScale = 256
SynergyMaxBonus = 4095

KScanSelect = 0
KScanRepack = 0
VPadBin = 4096

ALNS = false
ALNSIslands = 1

PT = false
PT_T_Min = 1.0
PT_T_Max = 10.0
PT_SwapInterval = 8
PT_DestroyBeta = 0.0
PT_CapSlackMax = 0

Human = false
HumanGearPenaltyStep = 0
HumanGearFree = 2
HumanColoredPenalty = 0

RestrictedUniversePath =
