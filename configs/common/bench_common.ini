; bench_common.ini - Shared base for all bench config profiles.
;
; All 5 bench configs share 80%+ of their content. This file captures the
; shared skeleton. Each bench config declares  _extends = common/bench_common.ini
; and only overrides its differing values (typically SongQueueLimit, Difficulty,
; InFlightSongs, or IgnoreResumeQueue).
;
; LOADING: gear_optimizer.core.config.load_config reads _extends entries and
; layers them (later entries win). This file is loaded FIRST, then the
; specific bench config overrides it.

[CalculateSong]
; Benchmark: process a deterministic subset of songs (see IterationEngine.SongQueueLimit).
Song_Name =
Difficulty = All
TargetPrimary = All
TargetSecondary = All
LoopForever = false

[IterationEngine]
ForceGreatsDebug = false

; Resource limits
EvalCPUCores = 0
InFlightSongs = 0

[TeamContributionBuffConstant]
TeamBuff = T5
TeamColor = Rush

