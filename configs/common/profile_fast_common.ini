; profile_fast_common.ini - Shared base for the "fast" profile configs
; (inflight_queue24_fast, inflight_queue24_fast_inflight24, inflight_queue6_fast_inflight8).
;
; These three profiles share the same short-GA, Hard-difficulty skeleton and
; differ only in InFlightSongs and SongQueueLimit. This file captures the
; shared structure; each specific profile overrides only what differs.

[CalculateSong]
; Fast profile: Hard songs only for quick profiling of FG interleaving.
Song_Name =
Difficulty = Hard
TargetPrimary = All
TargetSecondary = All
LoopForever = false

[IterationEngine]
ForceGreatsDebug = false

; Keep the run short but realistic enough to exercise FG interleaving.
GA_SearchDepth = 80
GA_MultiStart = 6

FG_CandidateLimit = 200

EvalCPUCores = 0

[TeamContributionBuffConstant]
TeamBuff = T5
TeamColor = Rush

[Gear]
Hat =
Neck =
Face =
Shirt =
Back =
Pant =

[Minis]
1 =
2 =
3 =

[UserInputStatsGems]
perfect_points = 0
combo_multiplier = 0
fever_multiplier = 11
fever_fill = 16
fever_time = 0

[ElementalGems]
Chill = 0
Flow = 0
Rush = 0
Beat = 0
Vibe = 63
