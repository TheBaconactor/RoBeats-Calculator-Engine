ForceGreatsMode = true
ForceGreatsFinder = true
ForceGreatsDebug = false
AutoSelectBuffAndColor = true

; GPU acceleration
GPU_Mode = true
GPU_Native_GA = true

; Database integration
UseEvolutionDB = True
LoopForever = false

