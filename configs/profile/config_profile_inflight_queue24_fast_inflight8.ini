; Profile: 8 inflight lanes with 24 Hard songs, fast GA.
; Inherits shared fast-profile settings from ../common/profile_fast_common.ini.
[IterationEngine]
_extends = ../common/profile_fast_common.ini
; Override: 8 inflight lanes for queue-saturation profiling.
InFlightSongs = 8
; Keep the profiling run <32 songs (matches reported stall region).
SongQueueLimit = 24
