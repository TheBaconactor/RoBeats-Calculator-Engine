[project]
name = "gear-optimizer"
version = "0.0.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "bin",
  "Data",
  "legacy",
  "RoBeatMetaWebsite",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]

# This project is a CLI/worker-style app that intentionally uses prints for user-facing status.
# Keep prints allowed by default, and optionally tighten later.
ignore = [
  "E501", # line length handled by formatter; keep noise down for now
]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


