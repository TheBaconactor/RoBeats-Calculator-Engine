name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements-dev.txt

      - name: Quality Check (CI Harness)
        run: |
          powershell -ExecutionPolicy Bypass -File tools/dev/quality_check.ps1 -CI

  gpu-regression-guards:
    # Opt-in job for a self-hosted GPU runner.
    # Enable by setting repo variable RUN_SELF_HOSTED_GPU_CI=1 and providing a runner with labels:
    # self-hosted, windows, x64, gpu
    if: ${{ vars.RUN_SELF_HOSTED_GPU_CI == '1' }}
    runs-on: [self-hosted, windows, x64, gpu]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements-dev.txt

      - name: GPU Regression Guards (Baseline + Mutations)
        run: |
          python tools/dev/mutation_regression_guards.py
