[CalculateSong]
; Target the specific chart you care about.
; If you want to process everything again, set Song_Name = (empty) or change Difficulty.
Song_Name = ATENA
Difficulty = Hard
TargetPrimary = All
TargetSecondary = All

[IterationEngine]
; MetaFinder toggles all optimizers (gear, minis, gem solver) at once.
MetaFinder = True
ForceGreatsMode = TRUE
ForceGreatsFinder = TRUE

GPU_GemSolver = True

; Auto buff/color: overwritten per-song to its primary color by the script
AutoSelectBuffAndColor = TRUE

; GA / memetic settings (these are fine to keep as-is)
GA_SearchDepth = 75
GA_MultiStart = 3
GA_DBSeedProbability = 0.5
GA_FixedSeedCopies = 2

; Use evolution DB as seed + to store best results
UseEvolutionDB = TRUE

; Deep Mining: extend generations based on cache hits (TRUE) or fixed generation count (FALSE)
DeepMining = FALSE

; Continuous loop; set to FALSE if you want a single pass only
LoopForever=false

; 0 or empty = auto-detect and use all cores
EvalCPUCores = 0

MemorySoftLimitGB = 7
MemorySoftLimitPercent = 0

[TeamContributionBuffConstant]
; This will be overridden at runtime when AutoSelectBuffAndColor=TRUE,
; but keeping a sane default is still nice.
TeamBuff = T5
TeamColor = Rush

[Gear]
; These are just your current “starting point” / fallback.
; GA + memetic local search will move away from these if it finds better.
Hat  = Autumnal Adept's Bloom
Neck = Legendary Marshall's Chains
Face = Legendary Marshall's Mask
Shirt = Legendary Marshall's Coat
Back  = Legendary Rush Chieftan's Aura Band
Pant  = Legendary Rush Chieftan's Pants

[Minis]
1 = Kurante Metal Dimensions
2 = Juggernaut
3 = 8-Bit Alien

[UserInputStatsGems]
; IMPORTANT: with any finder enabled, the script forcibly treats these as 0 in memory.
; Setting them to 0 here keeps the config honest and avoids confusion.
perfect_points   = 0
combo_multiplier = 0
fever_multiplier = 15
fever_fill       = 11
fever_time       = 0

[ElementalGems]
; Same reasoning: memetic solver + gem optimizer handle allocation internally.
Chill = 0
Flow  = 0
Rush  = 64
Beat  = 0
Vibe  = 0

[ForceGreats]
; Any non-zero entry enables manual force-great penalties per section.
NonFever1=0
NonFever2=0
NonFever3=0
NonFever4=0
