[CalculateSong]
; Target song and difficulty
Song_Name = Feeling Alright
Difficulty = All
TargetPrimary = All
TargetSecondary = All

[IterationEngine]
; Main optimizer toggles
MetaFinder = true
ForceGreatsMode = true
ForceGreatsFinder = true
ForceGreatsDebug = true
AutoSelectBuffAndColor = true

; GPU acceleration
GPU_Mode = true
GPU_Native_GA = true

; Database integration
UseEvolutionDB = True
LoopForever = false

; GA settings
GA_SearchDepth = 1000
GA_MultiStart = 1
GA_DBSeedProbability = 0.1
GA_FixedSeedCopies = 2
DeepMining = False

; Rank pool sizes (items considered for heuristic seeding)
GearRankMax = 40
MiniRankMax = 40

; Resource limits
EvalCPUCores = 0
MaxParallelSongs = 1
MemorySoftLimitGB = 7
MemorySoftLimitPercent = 0

[TeamContributionBuffConstant]
; Auto-overridden per song when AutoSelectBuffAndColor=True
TeamBuff = T5
TeamColor = Rush

[Gear]
; Starting gear (GA will optimize from here)
Hat = Autumnal Adept's Bloom
Neck = Legendary Marshall's Chains
Face = Legendary Rebel's Mask
Shirt = Legendary Marshall's Coat
Back = Legendary Rebel's Sash
Pant = Legendary Rebel's Trousers

[Minis]
; Starting minis (GA will optimize from here)
1 = DJ Hiku: Party Mode
2 = HyuN
3 = Apocalypse Survivor Starlet

[UserInputStatsGems]
perfect_points = 0
combo_multiplier = 0
fever_multiplier = 4
fever_fill = 8
fever_time = 9

[ElementalGems]
; Overflow gems for each element
Chill = 69
Flow = 0
Rush = 0
Beat = 0
Vibe = 0

[HumanHitSim]
; Simulate human hit timestamps (server-parity fever modeling).
; - Enabled: toggles simulation
; - ApplyTo: "FG" (default) to only affect ForceGreats modeling, or "ALL"
; - Seed: 0 => deterministic per-song seed
; - Distribution: currently only "uniform" is supported
Enabled = true
ApplyTo = All
Seed = 0
Distribution = uniform
; - GreatMode: timing mode for forced greats simulation
;     "late" (default): Late-only Great band [PerfectUpper+1, GreatUpper]
;     "early": Early-only Great band [GreatLower, PerfectLower-1]
;     "full": Full Great window [GreatLower, GreatUpper]
GreatMode = full
