[CalculateSong]
; PRODUCTION: song target selection inputs (Song_Name, Difficulty, TargetPrimary, TargetSecondary).
Song_Name =
Difficulty =
TargetPrimary = All
TargetSecondary = All

; Flag taxonomy:
;   PRODUCTION = used in modern production runs
;   DEV / DEBUG = legacy, trace, or narrowing-only

[IterationEngine]
; PRODUCTION: core runtime flags (MetaFinder, ForceGreatsMode, ForceGreatsFinder, AutoSelectBuffAndColor).
MetaFinder = true
ForceGreatsMode = true
ForceGreatsFinder = true
; DEV / DEBUG: diagnostic-only flag (ForceGreatsDebug).
ForceGreatsDebug = false
AutoSelectBuffAndColor = true

; PRODUCTION: GPU acceleration flags (GPU_Mode, GPU_Native_GA).
GPU_Mode = true
GPU_Native_GA = true

; PRODUCTION: database / loop flags (UseEvolutionDB, LoopForever).
UseEvolutionDB = True
LoopForever = true

; PRODUCTION: repeat / queue flags (SongRepeats, BundleSongRepeats).
; Run each queued song this many times (like FG repeats), with a fresh random GA seed each run.
; You can also override via env var: SONG_REPEATS
SongRepeats = 2
BundleSongRepeats = true

; PRODUCTION: GA tuning flags (GA_SearchDepth, GA_MultiStart, GA_DBSeedProbability, GA_FixedSeedCopies).
GA_SearchDepth = 75
GA_MultiStart = 3
GA_DBSeedProbability = 0.1
GA_FixedSeedCopies = 2
; DEV / DEBUG: legacy exploratory knob (DeepMining).
DeepMining = False

; PRODUCTION: ForceGreats finder flags (FG_CandidateLimit, FG_SearchRadius).
; - FG_CandidateLimit: how many unique loadouts FG evaluates (DB + GA funnel)
; - FG_SearchRadius: -1 => full FT/FF window (all pairs within budget), otherwise radius around each loadout center
FG_CandidateLimit = 51
FG_SearchRadius = 5

; PRODUCTION: GPU-native GA tuning flags (GPU_GA_MutationRate, GPU_GA_TournamentK, GPU_GA_ImmigrantRate).
GPU_GA_MutationRate = 0.35
GPU_GA_TournamentK = 3
GPU_GA_ImmigrantRate = 0.1

; DEV / DEBUG: tracing-only flags (GAConvergenceTrace, GAConvergenceTraceEvery, GAConvergenceTraceOutDir, GAConvergenceTraceSongFilter).
GAConvergenceTrace = false
GAConvergenceTraceEvery = 1
GAConvergenceTraceOutDir = artifacts/ga_trace
GAConvergenceTraceSongFilter =

; PRODUCTION: rank pool sizing flags (GearRankMax, MiniRankMax).
GearRankMax = 40
MiniRankMax = 40

; PRODUCTION: resource limit flags (EvalCPUCores, InFlightSongs, FG_DrainAtEnd, MemorySoftLimitGB, MemorySoftLimitPercent).
EvalCPUCores = 0
; PRODUCTION: in-flight overlap flags (InFlight_GA_QueueMult, InFlight_PrepBufferMult, InFlight_PrepWorkers, InFlight_DecodeWorkers, InFlight_FGPrepWorkers, InFlight_PrimeTarget).
; Uses a GPU-owner thread + interleaves CPU GA work across songs (no per-song multiprocessing).
; Enable with a small value like 2-6 (requires GPU_Mode=true; works with GPU_Native_GA=true).
; When ForceGreatsFinder is enabled, FG is interleaved to avoid starving GA throughput.
; Your machine: 64GB RAM / 24GB VRAM -> safe to push overlap harder.
InFlightSongs = 12
FG_DrainAtEnd = true
; Allow higher overlap without tripping MemoryGuard (adjust if you want stricter limits).
MemorySoftLimitGB = 32
MemorySoftLimitPercent = 0

; ----------------------------
; Native in-flight overlap knobs (no env vars needed)
; ----------------------------
; PRODUCTION: keep more GA jobs queued so GPU won't idle while CPU decodes GA results / preps FG.
InFlight_GA_QueueMult = 3
; PRODUCTION: keep a larger prepared/prep buffer so CPU prep can't starve the GPU.
InFlight_PrepBufferMult = 8
; PRODUCTION: CPU feeder threads.
InFlight_PrepWorkers = 8
InFlight_DecodeWorkers = 8
InFlight_FGPrepWorkers = 8
; PRODUCTION: synchronous priming to reduce the initial startup bubble.
InFlight_PrimeTarget = 6

[TeamContributionBuffConstant]
; PRODUCTION: team-buff/color flags (TeamBuff, TeamColor).
TeamBuff = T5
TeamColor = Rush

[Gear]
; PRODUCTION: starting gear flags (Hat, Neck, Face, Shirt, Back, Pant).
Hat =
Neck =
Face =
Shirt =
Back =
Pant =

[Minis]
; PRODUCTION: starting mini flags (1, 2, 3).
1 =
2 =
3 = 

[UserInputStatsGems]
; PRODUCTION: user-input stat gem flags (perfect_points, combo_multiplier, fever_multiplier, fever_fill, fever_time).
perfect_points = 0
combo_multiplier = 0
fever_multiplier = 11
fever_fill = 16
fever_time = 0

[ElementalGems]
; PRODUCTION: overflow gem flags (Chill, Flow, Rush, Beat, Vibe).
Chill = 0
Flow = 0
Rush = 0
Beat = 0
Vibe = 63

[HumanHitSim]
; PRODUCTION: human-hit simulation flags (Enabled, ApplyTo, Seed, Distribution, GreatMode).
; Simulate human hit timestamps (server-parity fever modeling).
Enabled = true
ApplyTo = All
Seed = 0
Distribution = uniform
GreatMode = Full

; DEV / DEBUG: manual ForceGreats fallback flags (NonFever1, NonFever2); legacy and only used when ForceGreatsFinder=false.
[ForceGreats]
NonFever1 = 0
NonFever2 = 0
