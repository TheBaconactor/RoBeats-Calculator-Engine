[CalculateSong]
; Target song and difficulty
Song_Name = RB Battles 2020
Difficulty = Hard
TargetPrimary = All
TargetSecondary = All

[IterationEngine]
; Main optimizer toggles
MetaFinder = True
ForceGreatsMode = True
ForceGreatsFinder = True
AutoSelectBuffAndColor = True

; GPU acceleration
GPU_Mode = True
GPU_Native_GA = True

; Database integration
UseEvolutionDB = True
LoopForever = False

; GA settings
GA_SearchDepth = 500
GA_MultiStart = 30
GA_DBSeedProbability = 0.1
GA_FixedSeedCopies = 2
DeepMining = False

; FG caps per section (comma-separated)
FG_SectionCaps = 66, 66, 15, 10, 8, 6, 5, 4

; Rank pool sizes (items considered for heuristic seeding)
GearRankMax = 40
MiniRankMax = 40

; Resource limits
EvalCPUCores = 0
MaxParallelSongs = 1
MemorySoftLimitGB = 7
MemorySoftLimitPercent = 0

[TeamContributionBuffConstant]
