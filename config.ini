[CalculateSong]
; Target song and difficulty
Song_Name = 
Difficulty =
TargetPrimary = All
TargetSecondary = All

[IterationEngine]
; Main optimizer toggles
MetaFinder = true
ForceGreatsMode = true
ForceGreatsFinder = true
ForceGreatsDebug = True
AutoSelectBuffAndColor = True

; GPU acceleration
GPU_Mode = true
GPU_Native_GA = true

; Database integration
UseEvolutionDB = True
LoopForever = true

; GA settings
GA_SearchDepth = 250
GA_MultiStart = 15
GA_DBSeedProbability = 0.1
GA_FixedSeedCopies = 2
DeepMining = False

; Rank pool sizes (items considered for heuristic seeding)
GearRankMax = 40
MiniRankMax = 40

; Resource limits
EvalCPUCores = 0
MaxParallelSongs = 1
MemorySoftLimitGB = 7
MemorySoftLimitPercent = 0

[TeamContributionBuffConstant]
; Auto-overridden per song when AutoSelectBuffAndColor=True
TeamBuff = T5
TeamColor = Rush

[Gear]
; Starting gear (GA will optimize from here)
Hat = Legendary Vibe Ringleader's Cap
Neck = Legendary Vibe Ringleader's Necktie
Face = Legendary Vibe Ringleader's Harmonica
Shirt = Legendary Vibe Ringleader's Suit
Back = Legendary Vibe Ringleader's Band Kit
Pant = Legendary Vibe Ringleader's Slacks

[Minis]
; Starting minis (GA will optimize from here)
1 = Electroman
2 = Ringmaster Roxie
3 = Heavy Metal Starlet

[UserInputStatsGems]
perfect_points = 0
combo_multiplier = 0
fever_multiplier = 7
fever_fill = 21
fever_time = 4

[ElementalGems]
; Overflow gems for each element
Chill = 0
Flow = 0
Rush = 
Beat = 0
Vibe = 58

[HumanHitSim]
; Optional: simulate human hit timestamps (server-parity fever modeling).
; - Enabled: toggles simulation
; - ApplyTo: "FG" (default) to only affect ForceGreats modeling, or "ALL"
; - Seed: 0 => deterministic per-song seed
; - Distribution: currently only "uniform" is supported
Enabled = False
ApplyTo = FG
Seed = 0
Distribution = uniform
