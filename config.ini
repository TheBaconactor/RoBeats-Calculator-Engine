[CalculateSong]
; Target song and difficulty
Song_Name = Decoy World
Difficulty = Hard
TargetPrimary = All
TargetSecondary = All

[IterationEngine]
; Main optimizer toggles
MetaFinder = True
ForceGreatsMode = True
ForceGreatsFinder = True
ForceGreatsDebug = True
AutoSelectBuffAndColor = True

; GPU acceleration
GPU_Mode = True
GPU_Native_GA = True

; Database integration
UseEvolutionDB = True
LoopForever = false

; GA settings
GA_SearchDepth = 250
GA_MultiStart = 15
GA_DBSeedProbability = 0.1
GA_FixedSeedCopies = 2
DeepMining = False

; Rank pool sizes (items considered for heuristic seeding)
