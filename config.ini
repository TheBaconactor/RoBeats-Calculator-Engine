[CalculateSong]
; Target song and difficulty
Song_Name = Feeling Alright
Difficulty = All
TargetPrimary = All
TargetSecondary = All

[Optimization]
; Main optimizer toggles
MetaFinder = True
ForceGreatsMode = True
ForceGreatsFinder = True
AutoSelectBuffAndColor = True

; Database integration
UseEvolutionDB = True
LoopForever = False

[GPU]
; GPU acceleration (recommended)
GPU_Mode = True
GPU_Native_GA = True

[GeneticAlgorithm]
; Core GA settings
GA_SearchDepth = 500
GA_MultiStart = 30
GA_DBSeedProbability = 0.1
GA_FixedSeedCopies = 2
