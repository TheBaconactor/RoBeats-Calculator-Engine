[CalculateSong]
; Target song and difficulty
Song_Name =
Difficulty = All
TargetPrimary = All
TargetSecondary = All

[IterationEngine]
; Main optimizer toggles
MetaFinder = true
ForceGreatsMode = true
ForceGreatsFinder = true
ForceGreatsDebug = false
AutoSelectBuffAndColor = true

; Master profiling gate:
; - When DebugProfile=false, all env-var profiling/instrumentation toggles are ignored/disabled.
; - When DebugProfile=true, you can enable profiling via env vars (PERF_TIMING/GPU_PROFILER/etc).
DebugProfile = false

; GPU acceleration
; ---------------------------------------------------------------------------
; GPU-ONLY POLICY:
; - CPU mode is reference-only and MUST NOT be used for production runs.
; - Keep GPU_Mode enabled by default; disable GPU only for narrow parity/debug.
; ---------------------------------------------------------------------------
GPU_Mode = true
GPU_Native_GA = true

; Database integration
UseEvolutionDB = True
LoopForever = false

; Song repeats (queue inflation)
; Run each queued song this many times (like FG repeats), with a fresh random GA seed each run.
; You can also override via env var: SONG_REPEATS
SongRepeats = 1
; Cap number of discovered songs to process (0 = no limit)
SongQueueLimit = 0

; GA settings
GA_SearchDepth = 300
GA_MultiStart = 15
GA_DBSeedProbability = 0.1
GA_FixedSeedCopies = 2
DeepMining = False

; ForceGreats Finder controls
; - FG_CandidateLimit: how many unique loadouts FG evaluates (DB + GA funnel)
; - FG_SearchRadius: -1 => full FT/FF window (all pairs within budget), otherwise radius around each loadout center
FG_CandidateLimit = 100
FG_SearchRadius = 5

; GPU-native GA exploration knobs (optional)
GPU_GA_MutationRate = 0.35
GPU_GA_TournamentK = 3
GPU_GA_ImmigrantRate = 0.1

; Rank pool sizes (items considered for heuristic seeding)
GearRankMax = 40
MiniRankMax = 40

; Resource limits
EvalCPUCores = 0
; Experimental: single-process multi-song in-flight pipeline.
; Uses a GPU-owner thread + interleaves CPU GA work across songs (no per-song multiprocessing).
; Enable with a small value like 2-6 (requires GPU_Mode=true; works with GPU_Native_GA=true).
; When ForceGreatsFinder is enabled, FG is interleaved to avoid starving GA throughput.
; Your machine: 64GB RAM / 24GB VRAM -> safe to push overlap harder.
InFlightSongs = 14
FG_InterleaveEvery = 24
FG_DrainAtEnd = false
; Allow higher overlap without tripping MemoryGuard (adjust if you want stricter limits).
MemorySoftLimitGB = 32
MemorySoftLimitPercent = 0

; ----------------------------
; Native in-flight overlap knobs (no env vars needed)
; ----------------------------
; Keep more GA jobs queued so GPU won't idle while CPU decodes GA results / preps FG.
InFlight_GA_QueueMult = 2
; Keep a larger prepared/prep buffer so CPU prep can't starve the GPU.
InFlight_PrepBufferMult = 8
; CPU feeder threads
InFlight_PrepWorkers = 8
InFlight_DecodeWorkers = 8
InFlight_FGPrepWorkers = 8
; Synchronous priming to reduce the initial startup bubble
InFlight_PrimeTarget = 6

[TeamContributionBuffConstant]
; Auto-overridden per song when AutoSelectBuffAndColor=True
TeamBuff = T5
TeamColor = Rush

[Gear]
; Starting gear (GA will optimize from here)
Hat =
Neck =
Face =
Shirt =
Back =
Pant =

[Minis]
; Starting minis (GA will optimize from here)
1 =
2 =
3 = 

[UserInputStatsGems]
perfect_points = 0
combo_multiplier = 0
fever_multiplier = 11
fever_fill = 16
fever_time = 0

[ElementalGems]
; Overflow gems for each element
Chill = 0
Flow = 0
Rush = 0
Beat = 0
Vibe = 63

[HumanHitSim]
; Simulate human hit timestamps (server-parity fever modeling).
; - Enabled: toggles simulation
; - ApplyTo: "FG" (default) to only affect ForceGreats modeling, or "ALL"
; - Seed: 0 => random seed per song/run (the chosen seed is printed + stored in results metadata)
; - Distribution: currently only "uniform" is supported
Enabled = true
ApplyTo = All
Seed = 0
Distribution = uniform
; - GreatMode: timing mode for forced greats simulation
;     "late" (default): Late-only Great band [PerfectUpper+1, GreatUpper]
;     "early": Early-only Great band [GreatLower, PerfectLower-1]
;     "full": Full Great window [GreatLower, GreatUpper]
GreatMode = Full

; Manual ForceGreats section alternative (also used only when ForceGreatsFinder=false):
[ForceGreats]
NonFever1 = 0
NonFever2 = 0
